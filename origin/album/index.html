<link rel="stylesheet" href="/assets/album/album.css">

<section class="album">
    <div class="album__view">
        <header class="album__head">
            <h1 class="album__title album__title--small">相册</h1>
            <span class="album__count"></span>
        </header>

        <div class="album__grid"></div>

        <p class="album__empty" hidden>
            这里还没有照片。把图片放进 <code>origin/album/photos/</code> 就会自动出现在这里。
        </p>
    </div>

    <!-- 大图 -->
    <div class="album__lightbox" hidden>
        <button class="album__nav album__nav--prev" type="button" aria-label="上一张"></button>
        <button class="album__nav album__nav--next" type="button" aria-label="下一张"></button>
        <button class="album__close" type="button" aria-label="关闭"></button>
        <figure class="album__figure">
            <img class="album__photo" alt="">
            <figcaption class="album__caption"></figcaption>
        </figure>
    </div>
</section>

<script src="/assets/album/album.js" defer></script>
