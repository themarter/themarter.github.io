<style>
    :root {
        --bg: #fbfaf8;
        --panel: #ffffff;
        --ink: #191a1c;
        --muted: #6b7076;
        --faint: #9aa0a6;
        --line: #e6e2dc;
        --accent: #2f6b58;
        --radius: 14px;
    }

    * {
        box-sizing: border-box;
    }

    html {
        -webkit-text-size-adjust: 100%;
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.75 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
            'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        -webkit-font-smoothing: antialiased;
    }

    a {
        color: var(--accent);
        text-decoration: none;
        text-underline-offset: 3px;
    }

    a:hover {
        text-decoration: underline;
    }

    /* ---------- 框架 ---------- */
    .site-header {
        max-width: 760px;
        margin: 0 auto;
        padding: 30px 24px 0;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
    }

    .brand {
        font-size: 15px;
        font-weight: 600;
        color: var(--ink);
        letter-spacing: 0.01em;
    }

    .site-nav a {
        margin-left: 20px;
        font-size: 14px;
        color: var(--muted);
    }

    .site-nav a:first-child {
        margin-left: 0;
    }

    .site-main {
        max-width: 760px;
        margin: 0 auto;
        padding: 44px 24px 72px;
    }

    .site-footer {
        max-width: 760px;
        margin: 0 auto;
        padding: 22px 24px 44px;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        font-size: 13px;
        color: var(--faint);
    }

    /* ---------- 首页 ---------- */
    .eyebrow {
        margin: 0 0 14px;
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--faint);
    }

    h1 {
        margin: 0 0 14px;
        font-size: clamp(30px, 5.2vw, 44px);
        line-height: 1.18;
        letter-spacing: -0.022em;
        font-weight: 650;
    }

    .lead {
        margin: 0 0 44px;
        font-size: 17px;
        color: var(--muted);
        max-width: 56ch;
    }

    .section-title {
        margin: 0 0 16px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--faint);
    }

    /* ---------- 页面列表 ---------- */
    .page-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 12px;
    }

    .page-list a.page-link {
        display: block;
        padding: 18px 20px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        color: inherit;
        transition: border-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
    }

    .page-list a.page-link:hover {
        text-decoration: none;
        border-color: #d3cec6;
        transform: translateY(-2px);
        box-shadow: 0 8px 22px rgba(25, 26, 28, 0.05);
    }

    .page-title {
        display: block;
        font-weight: 600;
        font-size: 16.5px;
    }

    .page-desc {
        display: block;
        margin-top: 5px;
        font-size: 14px;
        color: var(--muted);
    }

    .page-meta {
        display: block;
        margin-top: 12px;
        font-size: 12px;
        color: var(--faint);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
    }

    .empty {
        padding: 28px 20px;
        border: 1px dashed var(--line);
        border-radius: var(--radius);
        color: var(--faint);
        font-size: 14px;
        text-align: center;
    }

    /* ---------- 内容页 ---------- */
    .article {
        font-size: 16.5px;
    }

    .article h2 {
        margin: 2.2em 0 0.7em;
        font-size: 22px;
        letter-spacing: -0.01em;
    }

    .article h3 {
        margin: 1.8em 0 0.6em;
        font-size: 18px;
    }

    .article p {
        margin: 0 0 1.1em;
    }

    .article ul,
    .article ol {
        padding-left: 1.4em;
        margin: 0 0 1.1em;
    }

    .article li {
        margin: 0.3em 0;
    }

    .article img {
        max-width: 100%;
        height: auto;
        border-radius: 10px;
        display: block;
        margin: 1.6em 0;
    }

    .article blockquote {
        margin: 1.6em 0;
        padding: 4px 18px;
        border-left: 3px solid var(--line);
        color: var(--muted);
    }

    .article hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 2.4em 0;
    }

    .article code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.9em;
    }

    .article :not(pre) > code {
        background: #f1eee8;
        padding: 2px 6px;
        border-radius: 6px;
    }

    .article pre {
        background: #16181c;
        color: #e9e8e4;
        padding: 16px 18px;
        border-radius: 10px;
        overflow-x: auto;
        font-size: 13.5px;
        line-height: 1.6;
    }

    .article pre code {
        background: none;
        padding: 0;
    }

    .article table {
        width: 100%;
        border-collapse: collapse;
        margin: 1.6em 0;
        font-size: 14.5px;
    }

    .article th,
    .article td {
        border: 1px solid var(--line);
        padding: 8px 12px;
        text-align: left;
    }

    .article th {
        background: #f6f4f0;
        font-weight: 600;
    }

    @media (max-width: 600px) {
        .site-main {
            padding: 32px 20px 56px;
        }

        .site-header {
            padding: 22px 20px 0;
        }

        .site-footer {
            padding: 20px 20px 36px;
        }

        .lead {
            margin-bottom: 34px;
        }
    }
</style>
